name: BearMailbox
options:
  bundleIdPrefix: app.bearden
  deploymentTarget:
    iOS: "17.0"
targets:
  BearMailbox:
    type: application
    platform: iOS
    sources: [BearMailbox]
    info:
      path: Support/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bearden.mailbox
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "117"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 熊窝
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择照片作为头像、主页或聊天背景
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存聊天图片到照片图库
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄照片发给对方
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 发送当前位置给对方
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 长按发送语音，轻点语音转文字
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 将你的语音转换成输入文字
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  BearMailboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BearMailboxUITests]
    dependencies:
      - target: BearMailbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bearden.mailbox.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BearMailbox
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  BearMailbox:
    build:
      targets:
        BearMailbox: all
    test:
      targets: [BearMailboxUITests]
