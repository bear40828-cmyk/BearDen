# BearDen 反向代理：把朋友圈服务（moments:8799）和聊天服务器（chat:8810）
# 拼成 App 要用的单一入口 http://<主机>:8080。
# 注意：/api/profile 两个服务各自定义了一份，这里统一路由给聊天服务器
# （见根 README「已知限制」：一体部署下朋友圈头像修改会落到聊天服务器）。

upstream moments {
    server moments:8799;
}

upstream chat {
    server chat:8810;
}

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 流式输出（SSE）：关缓冲、拉长超时。
    location = /api/stream {
        proxy_pass http://chat;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # ---- 朋友圈服务（前缀匹配：/api/post/delete、/api/comment/delete 也要落到这里） ----
    location /api/feed { proxy_pass http://moments; }
    location /api/post { proxy_pass http://moments; }
    location /api/like { proxy_pass http://moments; }
    location /api/comment { proxy_pass http://moments; }
    location /api/login { proxy_pass http://moments; }
    location /api/logout { proxy_pass http://moments; }
    location /api/albums { proxy_pass http://moments; }
    location /api/favorites { proxy_pass http://moments; }
    location /mcp/ { proxy_pass http://moments; }
    location /uploads/ { proxy_pass http://moments; }

    # ---- 聊天服务器：/api/profile 冲突，精确匹配路由给 chat（见已知限制） ----
    location = /api/profile { proxy_pass http://chat; }

    # 其余 /api/*、/web、/ 全部给聊天服务器。
    location /api/ { proxy_pass http://chat; }
    location /web { proxy_pass http://chat; }
    location / { proxy_pass http://chat; }
}
