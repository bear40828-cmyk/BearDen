name: build-ipa
permissions:
  contents: read
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project BearMailbox.xcodeproj -scheme BearMailbox -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Prepare unsigned ipa root
        run: |
          mkdir -p ipa-root/Payload
          cp -r build/Build/Products/Release-iphoneos/BearMailbox.app ipa-root/Payload/
  ui-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Verify activity controls on iPhone
        run: |
          bear_sim_device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcodebuild test -project BearMailbox.xcodeproj -scheme BearMailbox -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$bear_sim_device" -derivedDataPath ui-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -parallel-testing-enabled NO
