# BearDen 一体部署：朋友圈服务 + 聊天服务器 + 内置 API 工人 + 反向代理。
# 用法：cp .env.example .env，填好 AI 三件套，docker compose up -d --build。
# App 里服务器地址填 http://<主机>:8080。
services:
  moments:
    build: ./Backend/moments
    env_file: .env
    environment:
      MOMENTS_HOST: "0.0.0.0"
      MOMENTS_DATA_DIR: /app/data
    volumes:
      - moments-data:/app/data
    restart: unless-stopped

  chat:
    build: ./Server
    env_file: .env
    environment:
      CHAT_HOST: "0.0.0.0"
      CHAT_DATA_DIR: /app/data
      WORKER_TOKEN: ${WORKER_TOKEN:-}
    volumes:
      - chat-data:/app/data
    restart: unless-stopped

  worker:
    build: ./Server
    command: ["python3", "worker.py"]
    env_file: .env
    environment:
      CHAT_SERVER_URL: http://chat:8810
      WORKER_TOKEN: ${WORKER_TOKEN:-}
    depends_on:
      - chat
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - moments
      - chat
    restart: unless-stopped

volumes:
  moments-data:
  chat-data:
